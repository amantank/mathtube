<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MathTube</title>
<meta name="description" content="The math videos that Hacker News keeps telling each other to watch.">
<meta property="og:title" content="MathTube">
<meta property="og:description" content="The math videos that Hacker News keeps telling each other to watch.">
<meta property="og:url" content="https://mathtube.in/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='24' fill='white'%3E%CF%80%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #fff; --bg2: #f2f2f4; --text: #111; --muted: #5f6368; --line: #e3e3e8;
    --accent: #4f46e5; --chip-on: #111; --chip-on-text: #fff; --hover: rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0f13; --bg2: #23252d; --text: #eef0f4; --muted: #a2a6b0; --line: #2c2f38;
      --accent: #8b85ff; --chip-on: #eef0f4; --chip-on-text: #0e0f13; --hover: rgba(255,255,255,.08);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0f13; --bg2: #23252d; --text: #eef0f4; --muted: #a2a6b0; --line: #2c2f38;
    --accent: #8b85ff; --chip-on: #eef0f4; --chip-on-text: #0e0f13; --hover: rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { width: 22px; height: 22px; fill: currentColor; flex: none; }

  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); height: 56px; display: flex;
         align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; letter-spacing: -.5px; white-space: nowrap; }
  .brand .pi { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: #fff;
               display: grid; place-items: center; font: 700 20px Georgia, serif; }
  .brand b { color: var(--accent); }
  .search { flex: 1; max-width: 560px; margin: 0 auto; display: flex; }
  .search input { flex: 1; min-width: 0; height: 38px; padding: 0 14px; font: inherit; color: var(--text);
                  background: var(--bg); border: 1px solid var(--line); border-radius: 19px 0 0 19px; outline: none; }
  .search input:focus { border-color: var(--accent); }
  .search button { width: 56px; border: 1px solid var(--line); border-left: 0; border-radius: 0 19px 19px 0; background: var(--bg2); }
  .icon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .icon:hover { background: var(--hover); }

  .layout { display: flex; }
  .side { width: 200px; flex: none; padding: 12px; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; }
  .side a { display: flex; align-items: center; gap: 14px; padding: 9px 12px; border-radius: 10px; }
  .side a:hover { background: var(--hover); }
  .side a.on { background: var(--bg2); font-weight: 600; }
  .side hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  .side .small { color: var(--muted); font-size: 12px; padding: 6px 12px; }
  main { flex: 1; min-width: 0; padding: 16px 24px 48px; }

  .chips { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 14px; scrollbar-width: none; }
  .chip { flex: none; padding: 6px 12px; border-radius: 8px; background: var(--bg2); font-weight: 500; white-space: nowrap; }
  .chip.on { background: var(--chip-on); color: var(--chip-on-text); }
  .chip:hover:not(.on) { filter: brightness(.95); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 28px 16px; }
  .card .th, .row .th, .next .th { position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: var(--bg2); }
  .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.8); color: #fff; font-size: 12px;
           font-weight: 600; padding: 1px 5px; border-radius: 4px; }
  .vt { margin: 10px 0 4px; font-size: 16px; font-weight: 600; line-height: 1.35;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sub { color: var(--muted); font-size: 13px; }

  .row { display: grid; grid-template-columns: 360px 1fr; gap: 16px; margin-bottom: 16px; }
  .row .vt { margin-top: 0; font-size: 18px; }
  .snip { color: var(--muted); margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .watch { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 24px; max-width: 1700px; }
  .player { aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #000; }
  .player iframe { width: 100%; height: 100%; border: 0; display: block; }
  .watch h1 { font-size: 20px; margin: 12px 0 8px; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .actions .chan { font-weight: 600; margin-right: auto; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 18px; background: var(--bg2); font-weight: 500; }
  .pill:hover { filter: brightness(.95); }
  .pill.on { background: var(--chip-on); color: var(--chip-on-text); }
  .pill svg { width: 18px; height: 18px; }
  .desc { background: var(--bg2); border-radius: 12px; padding: 12px 14px; margin-top: 12px; }
  .desc p { margin: 6px 0; }
  .desc .meta { font-weight: 600; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tags a { color: var(--accent); }
  .comments h2 { font-size: 18px; margin: 24px 0 12px; }
  .cm { display: flex; gap: 12px; margin-bottom: 20px; }
  .av { width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; }
  .cm .who { font-size: 13px; }
  .cm .who b { margin-right: 6px; }
  .cm .who a { color: var(--muted); }
  .cm .text { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .mark { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 700; background: var(--bg2); color: var(--muted); }
  .mark.v { background: var(--accent); color: #fff; }
  .next { display: grid; grid-template-columns: 168px 1fr; gap: 8px; margin-bottom: 10px; }
  .next .th { border-radius: 8px; }
  .next .vt { margin: 0 0 4px; font-size: 14px; }

  .pagehead h2 { margin: 4px 0 4px; font-size: 24px; }
  .pagehead p { margin: 0 0 16px; color: var(--muted); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .about { max-width: 720px; font-size: 15px; }
  .about a { color: var(--accent); }
  .more { display: block; margin: 24px auto 0; }

  @media (max-width: 1100px) { .watch { grid-template-columns: 1fr; } }
  @media (max-width: 900px) { .side { display: none; } .side.open { display: block; position: fixed; left: 0; z-index: 6; background: var(--bg); box-shadow: 0 0 24px rgba(0,0,0,.3); } }
  @media (min-width: 901px) { #menu { display: none; } }
  @media (max-width: 640px) {
    main { padding: 12px 16px 40px; }
    .brand span.word { display: none; }
    .row { grid-template-columns: 1fr; }
    .next { grid-template-columns: 140px 1fr; }
  }
</style>
</head>
<body>
<header class="top">
  <button class="icon" id="menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
  <a class="brand" href="#/" aria-label="MathTube home"><span class="pi">π</span><span class="word">Math<b>Tube</b></span></a>
  <form class="search" id="search" role="search">
    <input id="q" type="search" placeholder="Search math videos  ( / )" autocomplete="off" aria-label="Search">
    <button aria-label="Search"><svg viewBox="0 0 24 24"><path d="M20.87 20.17l-5.59-5.59A6.95 6.95 0 0 0 17 10a7 7 0 1 0-7 7c1.75 0 3.35-.64 4.58-1.71l5.59 5.59.7-.71zM10 16a6 6 0 1 1 0-12 6 6 0 0 1 0 12z"/></svg></button>
  </form>
  <button class="icon" id="theme" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg></button>
</header>
<div class="layout">
  <nav class="side" id="side">
    <a href="#/" data-nav=""><svg viewBox="0 0 24 24"><path d="M4 21V10.08l8-6.96 8 6.96V21h-6v-6h-4v6H4z"/></svg>Home</a>
    <a href="#/liked" data-nav="liked"><svg viewBox="0 0 24 24"><path d="M18.77 11h-4.23l1.52-4.94C16.38 5.03 15.54 4 14.38 4c-.58 0-1.14.24-1.52.65L7 11H3v10h14.43c1.06 0 1.98-.67 2.19-1.61l1.34-6c.27-1.24-.78-2.39-2.19-2.39zM7 20H4v-8h3v8z"/></svg>Liked</a>
    <a href="#/later" data-nav="later"><svg viewBox="0 0 24 24"><path d="M14.97 16.95 10 13.87V7h2v5.76l4.03 2.49-1.06 1.7zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>Watch later</a>
    <a href="#/history" data-nav="history"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>History</a>
    <hr>
    <div class="small">Topics</div>
    <div id="topics"></div>
    <hr>
    <a href="#/about" data-nav="about"><svg viewBox="0 0 24 24"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>About</a>
  </nav>
  <main id="view"><div class="empty">Loading…</div></main>
</div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const view = $("#view");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("mt:" + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("mt:" + k, JSON.stringify(v)); } catch {} },
};
let DATA, BY = {};
const lists = { liked: store.get("liked", []), later: store.get("later", []), history: store.get("history", []) };
const toggle = (name, vid) => {
  const l = lists[name], i = l.indexOf(vid);
  i >= 0 ? l.splice(i, 1) : l.push(vid);
  store.set(name, l);
  return i < 0;
};

// theme
const applyTheme = (t) => t ? document.documentElement.setAttribute("data-theme", t) : document.documentElement.removeAttribute("data-theme");
applyTheme(store.get("theme", null));
$("#theme").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const t = dark ? "light" : "dark"; applyTheme(t); store.set("theme", t);
};
$("#menu").onclick = () => $("#side").classList.toggle("open");

// ---------- components ----------
const thumb = (v) => `<div class="th"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/${v.vid}/mqdefault.jpg"><span class="badge">${esc(v.level)}</span></div>`;
const recs = (v) => `${v.recs} HN recommender${v.recs === 1 ? "" : "s"} · ${v.years[0] === v.years[1] ? v.years[0] : v.years.join("–")}`;
const card = (v) => `<a class="card" href="#/watch/${v.vid}">${thumb(v)}<h3 class="vt">${esc(v.title)}</h3>
  <div class="sub">${esc(v.channel)}</div><div class="sub">${recs(v)}</div></a>`;
const row = (v) => `<a class="row" href="#/watch/${v.vid}">${thumb(v)}<div style="min-width:0"><h3 class="vt">${esc(v.title)}</h3>
  <div class="sub">${esc(v.channel)} · ${recs(v)}</div><div class="snip">${esc(v.summary)}</div></div></a>`;
const next = (v) => `<a class="next" href="#/watch/${v.vid}">${thumb(v)}<div style="min-width:0"><h3 class="vt">${esc(v.title)}</h3>
  <div class="sub">${esc(v.channel)}</div><div class="sub">${v.recs} recommenders</div></div></a>`;
const commentText = (t) => esc(t).replace(/\[VIDEO\]/g, '<span class="mark v">▶ this video</span>').replace(/\[LINK\]/g, '<span class="mark">link</span>');
const hue = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);

function grid(videos, paged = true) {
  if (!videos.length) return `<div class="empty">Nothing here yet.</div>`;
  const id = "g" + Math.random().toString(36).slice(2);
  setTimeout(() => {
    const el = document.getElementById(id); let n = 0;
    const more = () => { el.insertAdjacentHTML("beforeend", videos.slice(n, n += 48).map(card).join(""));
      btn.hidden = n >= videos.length; };
    const btn = document.getElementById(id + "m");
    btn.onclick = more; more();
  });
  return `<div class="grid" id="${id}"></div><button class="pill more" id="${id}m" hidden>Show more</button>`;
}

// seeded shuffle so "Shuffle" is stable while browsing, rerolls on reload
let seed = Math.floor(Math.random() * 1e9);
function shuffled(arr) {
  let s = seed; const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { s = (s * 1103515245 + 12345) % 2147483648; const j = s % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// ---------- pages ----------
function home(cat, sort) {
  const cats = DATA.categories;
  let vids = DATA.videos.filter((v) => !cat || v.cats.includes(cat));
  if (sort === "shuffle") vids = shuffled(vids);
  else if (sort === "intro") vids = vids.filter((v) => v.level === "intro" || v.level === "general");
  else if (sort === "deep") vids = vids.filter((v) => v.level === "intermediate" || v.level === "advanced");
  const q = (c, s) => `#/${c ? "c/" + c : ""}${s ? "?sort=" + s : ""}`;
  const sorts = [["", "Most recommended"], ["shuffle", "Shuffle"], ["intro", "Beginner-friendly"], ["deep", "Going deeper"]];
  view.innerHTML = `${cat ? `<div class="pagehead"><h2>${esc(cats[cat])}</h2></div>` : ""}
    <div class="chips">${[["", "All"], ...Object.entries(cats)].map(([id, name]) =>
      `<a class="chip ${id === (cat || "") ? "on" : ""}" href="${q(id, sort)}">${esc(name)}</a>`).join("")}</div>
    <div class="chips">${sorts.map(([s, name]) => `<a class="chip ${s === (sort || "") ? "on" : ""}" href="${q(cat, s)}">${name}</a>`).join("")}</div>
    ${grid(vids)}`;
}

function watch(vid) {
  const v = BY[vid];
  if (!v) { view.innerHTML = `<div class="empty">Video not found. <a href="#/">Go home</a></div>`; return; }
  lists.history = lists.history.filter((x) => x !== vid).concat(vid).slice(-200); store.set("history", lists.history);
  const related = (v.related || []).map((r) => BY[r]).filter(Boolean);
  const fill = DATA.videos.filter((x) => x.vid !== vid && !v.related?.includes(x.vid) && x.cats.some((c) => v.cats.includes(c)));
  const upNext = related.concat(fill).slice(0, 20);
  const btn = (name, label, icon) => `<button class="pill ${lists[name].includes(vid) ? "on" : ""}" data-toggle="${name}">${icon}${label}</button>`;
  view.innerHTML = `<div class="watch"><div>
    <div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${vid}?rel=0&autoplay=1" title="${esc(v.title)}"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
    <h1>${esc(v.title)}</h1>
    <div class="actions"><span class="chan">${esc(v.channel)}</span>
      ${btn("liked", "Like", '<svg viewBox="0 0 24 24"><path d="M18.77 11h-4.23l1.52-4.94C16.38 5.03 15.54 4 14.38 4c-.58 0-1.14.24-1.52.65L7 11H3v10h14.43c1.06 0 1.98-.67 2.19-1.61l1.34-6c.27-1.24-.78-2.39-2.19-2.39z"/></svg>')}
      ${btn("later", "Save", '<svg viewBox="0 0 24 24"><path d="M14.97 16.95 10 13.87V7h2v5.76l4.03 2.49-1.06 1.7zM12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/></svg>')}
      <a class="pill" href="https://www.youtube.com/watch?v=${vid}" target="_blank" rel="noopener">YouTube ↗</a></div>
    <div class="desc">
      <div class="meta">${recs(v)} · ${esc(v.type)} · ${esc(v.level)}</div>
      <p>${esc(v.summary)}</p>
      <p><b>Why HN recommends it:</b> ${esc(v.why)}</p>
      <div class="tags">${v.cats.map((c) => `<a href="#/c/${c}">#${esc(DATA.categories[c])}</a>`).join("")}
        ${v.tags.map((t) => `<a href="#/search/${encodeURIComponent(t)}">${esc(t)}</a>`).join("")}</div>
    </div>
    <section class="comments"><h2>What Hacker News said</h2>
      ${v.comments.map((c) => `<div class="cm"><div class="av" style="background:hsl(${hue(c.by)} 55% 45%)">${esc(c.by[0].toUpperCase())}</div>
        <div style="min-width:0"><div class="who"><b>${esc(c.by)}</b><a href="https://news.ycombinator.com/item?id=${c.id}" target="_blank" rel="noopener">${esc(c.month)} · on “${esc(c.story)}” ↗</a></div>
        <div class="text">${commentText(c.text)}</div></div></div>`).join("")}
    </section></div>
    <aside>${upNext.map(next).join("")}</aside></div>`;
  view.querySelectorAll("[data-toggle]").forEach((b) => b.onclick = () => b.classList.toggle("on", toggle(b.dataset.toggle, vid)));
  scrollTo(0, 0);
}

function search(q) {
  $("#q").value = q;
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const scored = DATA.videos.map((v) => {
    const title = v.title.toLowerCase(), meta = [v.channel, v.topic, ...v.tags].join(" ").toLowerCase(), body = (v.summary + " " + v.why).toLowerCase();
    let s = 0;
    for (const w of words) { const t = title.includes(w) * 5 + meta.includes(w) * 3 + body.includes(w); if (!t) return [0, v]; s += t; }
    return [s + v.score / 100, v];
  }).filter(([s]) => s > 0).sort((a, b) => b[0] - a[0]).map(([, v]) => v);
  view.innerHTML = `<div class="pagehead"><h2>Results for “${esc(q)}”</h2><p>${scored.length} video${scored.length === 1 ? "" : "s"}</p></div>
    ${scored.length ? scored.slice(0, 100).map(row).join("") : `<div class="empty">No math videos match that. Try “calculus”, “primes” or “3Blue1Brown”.</div>`}`;
}

function saved(name, title, blurb) {
  const vids = lists[name].slice().reverse().map((x) => BY[x]).filter(Boolean);
  view.innerHTML = `<div class="pagehead"><h2>${title}</h2><p>${blurb} Stored only in this browser.</p></div>${grid(vids)}`;
}

function about() {
  view.innerHTML = `<div class="about"><div class="pagehead"><h2>About MathTube</h2></div>
    <p>MathTube is YouTube with only the math videos worth your time: the ones Hacker News commenters keep recommending to each other, year after year. No algorithm chasing watch time, no shorts, no accounts.</p>
    <p>There are ${DATA.videos.length} videos right now. Each one shows why people recommended it, plus the actual Hacker News comments that pointed to it.</p>
    <p>Likes, Watch later and History are kept in your browser (localStorage). Nothing is sent anywhere. Videos play through YouTube's privacy-enhanced embed.</p>
    <p><b>Credits.</b> Inspired by <a href="https://hackertube.org" target="_blank" rel="noopener">HackerTube</a> by Andrej Karpathy, and built from its open dataset
    (<a href="https://opendatacommons.org/licenses/by/1-0/" target="_blank" rel="noopener">ODC-By 1.0</a>), which is derived from the
    <a href="https://huggingface.co/datasets/open-index/hacker-news" target="_blank" rel="noopener">open-index/hacker-news</a> dataset.
    Hacker News data is provided by Y Combinator, and comments remain the work of their authors. Videos, titles and channel names belong to their creators on
    <a href="https://www.youtube.com" target="_blank" rel="noopener">YouTube</a>. Not affiliated with YouTube, Google, Hacker News or Y Combinator.</p>
    <p>Keyboard: <b>/</b> to search, <b>Esc</b> to leave the search box.</p></div>`;
}

// ---------- router ----------
function route() {
  const [path, query] = decodeURIComponent(location.hash.slice(1) || "/").split("?");
  const sort = new URLSearchParams(query).get("sort") || "";
  const [, page, arg] = path.split("/");
  document.querySelectorAll(".side a").forEach((a) => a.classList.toggle("on",
    a.getAttribute("href") === "#/" + (page === "c" ? "c/" + arg : page || "")));
  $("#side").classList.remove("open");
  if (page !== "watch") scrollTo(0, 0);
  if (page === "watch") watch(arg);
  else if (page === "c") home(arg, sort);
  else if (page === "search") search(arg || "");
  else if (page === "liked") saved("liked", "Liked videos", "Videos you liked.");
  else if (page === "later") saved("later", "Watch later", "Videos you saved.");
  else if (page === "history") saved("history", "History", "Videos you opened.");
  else if (page === "about") about();
  else home("", sort);
  const v = page === "watch" && BY[arg];
  document.title = v ? `${v.title} - MathTube` : "MathTube";
}

$("#search").onsubmit = (e) => { e.preventDefault(); const q = $("#q").value.trim(); location.hash = q ? "#/search/" + encodeURIComponent(q) : "#/"; };
addEventListener("keydown", (e) => {
  if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); }
  if (e.key === "Escape") document.activeElement.blur();
});
addEventListener("hashchange", route);

fetch("data/videos.json").then((r) => r.json()).then((d) => {
  DATA = d;
  for (const v of d.videos) BY[v.vid] = v;
  $("#topics").innerHTML = Object.entries(d.categories).map(([id, name]) => `<a href="#/c/${id}">${esc(name)}</a>`).join("");
  route();
}).catch(() => { view.innerHTML = `<div class="empty">Could not load videos. Please refresh.</div>`; });
</script>
</body>
</html>
