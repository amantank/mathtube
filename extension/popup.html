<!doctype html>
<meta charset="utf-8">
<style>
  body { width: 260px; margin: 0; padding: 16px; font: 14px/1.4 system-ui, sans-serif; color: #111; background: #fff; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  label { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: #4f46e5; }
  .want { display: block; margin-top: 14px; }
  .want input { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 7px 9px; font: inherit;
    border: 1px solid #ccc; border-radius: 8px; }
  p { color: #5f6368; margin: 12px 0 0; font-size: 12px; }
  a { color: #4f46e5; }
</style>
<h1>π MathTube</h1>
<label><input type="checkbox" id="on"> Show only math on YouTube</label>
<label class="want">Only this kind of math (optional)
  <input id="want" maxlength="100" placeholder="e.g. linear algebra for beginners"></label>
<p>Hides non-math videos, Shorts and shelves. A small AI model running on your computer checks each video;
  nothing leaves your browser. <a href="https://mathtube.in" target="_blank">mathtube.in</a></p>
<script src="popup.js"></script>
