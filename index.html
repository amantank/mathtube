<style>
  :root {

    --accent: #4f46e5; --chip-on: #111; --chip-on-text: #fff; --hover: rgba(0,0,0,.05); --danger: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0f13; --bg2: #23252d; --text: #eef0f4; --muted: #a2a6b0; --line: #2c2f38;
      --accent: #8b85ff; --chip-on: #eef0f4; --chip-on-text: #0e0f13; --hover: rgba(255,255,255,.08); --danger: #ef7070;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0f13; --bg2: #23252d; --text: #eef0f4; --muted: #a2a6b0; --line: #2c2f38;
    --accent: #8b85ff; --chip-on: #eef0f4; --chip-on-text: #0e0f13; --hover: rgba(255,255,255,.08); --danger: #ef7070;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { width: 22px; height: 22px; fill: currentColor; flex: none; }
  [hidden] { display: none !important; }

  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); height: 56px; display: flex;
         align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; letter-spacing: -.5px; white-space: nowrap; }
  .brand .pi { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: #fff;
               display: grid; place-items: center; font: 700 20px Georgia, serif; }
  .brand b { color: var(--accent); }
  .search { flex: 1; min-width: 0; max-width: 560px; margin: 0 auto; display: flex; }
  .search input { flex: 1; min-width: 0; height: 38px; padding: 0 14px; font: inherit; color: var(--text);

  .search input:focus { border-color: var(--accent); }
  .search button { width: 56px; border: 1px solid var(--line); border-left: 0; border-radius: 0 19px 19px 0; background: var(--bg2); }
  .icon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }

  .side a { display: flex; align-items: center; gap: 14px; padding: 9px 12px; border-radius: 10px; }

  .side a.on { background: var(--bg2); font-weight: 600; }

  .banner { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 16px; margin-bottom: 16px;

  .banner p { margin: 0; flex: 1; min-width: 200px; }

  .lib .meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); }
  .tag { padding: 1px 8px; border-radius: 10px; background: var(--bg2); }
  .lib .th { margin-bottom: 10px; }

  .badge.c { background: var(--accent); }

  .row { display: grid; grid-template-columns: 360px 1fr; gap: 16px; margin-bottom: 16px; }

  .menu .on .box { background: var(--accent); border-color: var(--accent); color: #fff; }

  .desc p { margin: 6px 0; white-space: pre-wrap; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tags a { color: var(--accent); }
  .comments h2 { font-size: 18px; margin: 24px 0 12px; }
  .cm { display: flex; gap: 12px; margin-bottom: 20px; }
  .av { width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; }
  .cm .who { font-size: 13px; }

  .cm .text { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .mark { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 700; background: var(--bg2); color: var(--muted); }
  .mark.v { background: var(--accent); color: #fff; }
  .next { display: grid; grid-template-columns: 168px 1fr; gap: 8px; margin-bottom: 10px; }
  .next .th { border-radius: 8px; }

  .pagehead { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
  .pagehead > div { flex: 1; min-width: 200px; }
  .pagehead h2 { margin: 4px 0; font-size: 24px; }
  .pagehead p { margin: 0; color: var(--muted); white-space: pre-wrap; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .empty a { color: var(--accent); }
  .about { max-width: 720px; font-size: 15px; }
  .about a { color: var(--accent); }
  .more { display: block; margin: 24px auto 0; }

  .form { max-width: 640px; display: grid; gap: 18px; }
  .form label > span { display: block; font-weight: 600; margin-bottom: 6px; }
  .form input[type=url], .form input[type=text], .form textarea { width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; outline: none; }
  .form input:focus, .form textarea:focus { border-color: var(--accent); }
  .form textarea { min-height: 110px; resize: vertical; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .checks label { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; background: var(--bg2); cursor: pointer; }
  .hint { color: var(--muted); font-size: 13px; }
  .err { color: var(--danger); font-weight: 500; }

  .plgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px 16px; }
  .mosaic { display: grid; grid-template-columns: 1fr 1fr; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: var(--bg2); position: relative; }
  .mosaic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mosaic img:first-child:nth-last-child(2) { grid-column: span 2; }   /* a single video fills the cover */
  .mosaic .plcount { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.8); color: #fff; font-size: 12px; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
  .plrow { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; }
  .plrow .num { color: var(--muted); text-align: right; }
  .plrow .row { margin-bottom: 12px; grid-template-columns: 240px 1fr; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--chip-on); color: var(--chip-on-text);
           padding: 10px 16px; border-radius: 8px; z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }

  @media (max-width: 1100px) { .watch { grid-template-columns: 1fr; } }
  @media (max-width: 900px) { .side { display: none; } .side.open { display: block; position: fixed; left: 0; z-index: 6; background: var(--bg); box-shadow: 0 0 24px rgba(0,0,0,.3); } }
  @media (min-width: 901px) { #menu { display: none; } }
  @media (max-width: 640px) {
    main { padding: 12px 16px 40px; }
    .top { gap: 6px; padding: 0 8px; }

    .row, .plrow .row { grid-template-columns: 1fr; }
    .crow { grid-template-columns: 40px 1fr; }
    .crow .th { display: none; }
    .next { grid-template-columns: 140px 1fr; }
  }
</style>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const view = $("#view");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("mt:" + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("mt:" + k, JSON.stringify(v)); } catch {} },
};
// Community features (GitHub sign-in, sharing, upvotes, account playlists) are switched off for now;
// the API in /api still works, set this to true to bring them back.
const COMMUNITY = false;
const SITE_TITLE = document.title;
const DONATE_URL = "";   // e.g. a Razorpay / Buy Me a Coffee / UPI payment link; the Donate buttons stay hidden while empty
let DATA, BY = {}, COMM = [], PATHS = [], LIB = null;
let API = false, ME = null, VOTED = new Set();   // API is false when the site runs without the backend (plain static hosting)
const lists = { liked: store.get("liked", []), later: store.get("later", []), history: store.get("history", []) };
const toggle = (name, vid) => {
  const l = lists[name], i = l.indexOf(vid);
  i >= 0 ? l.splice(i, 1) : l.push(vid);
  store.set(name, l);
  return i < 0;
};
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
async function api(path, opts = {}) {
  const r = await fetch("/api/" + path, { credentials: "same-origin", ...opts,
    headers: opts.body ? { "Content-Type": "application/json" } : {}, body: opts.body && JSON.stringify(opts.body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.error || `Request failed (${r.status})`), { status: r.status, data });
  return data;
}

// theme
const applyTheme = (t) => t ? document.documentElement.setAttribute("data-theme", t) : document.documentElement.removeAttribute("data-theme");
applyTheme(store.get("theme", null));

// ---------- components ----------
const ago = (d) => {
  const s = (Date.now() - new Date(d)) / 1000;
  for (const [n, u] of [[31536000, "year"], [2592000, "month"], [86400, "day"], [3600, "hour"], [60, "minute"]])
    if (s >= n) { const k = Math.floor(s / n); return `${k} ${u}${k > 1 ? "s" : ""} ago`; }
  return "just now";
};
const thumb = (v) => `<div class="th"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/${v.vid}/mqdefault.jpg"><span class="badge ${v.community ? "c" : ""}">${esc(v.community ? "community" : v.level)}</span></div>`;
const meta = (v) => v.community ? `▲ ${v.votes} · shared by ${esc(v.by)} · ${ago(v.createdAt)}`
  : `${v.recs} HN recommender${v.recs === 1 ? "" : "s"} · ${v.years[0] === v.years[1] ? v.years[0] : v.years.join("–")}`;
const card = (v) => `<a class="card" href="#/watch/${v.vid}">${thumb(v)}<h3 class="vt">${esc(v.title)}</h3>
  <div class="sub">${esc(v.channel)}</div><div class="sub">${meta(v)}</div></a>`;
const row = (v) => `<a class="row" href="#/watch/${v.vid}">${thumb(v)}<div style="min-width:0"><h3 class="vt">${esc(v.title)}</h3>
  <div class="sub">${esc(v.channel)} · ${meta(v)}</div><div class="snip">${esc(v.summary)}</div></div></a>`;
const next = (v) => `<a class="next" href="#/watch/${v.vid}">${thumb(v)}<div style="min-width:0"><h3 class="vt">${esc(v.title)}</h3>
  <div class="sub">${esc(v.channel)}</div><div class="sub">${meta(v)}</div></div></a>`;
const voteBtn = (v) => `<button class="vote ${VOTED.has(v.vid) ? "on" : ""}" data-vote="${v.vid}" aria-label="Upvote"><span class="arr">▲</span><span>${v.votes}</span></button>`;
const crow = (v) => `<div class="crow">${voteBtn(v)}<a href="#/watch/${v.vid}">${thumb(v)}</a>
  <a href="#/watch/${v.vid}" style="min-width:0"><h3 class="vt" style="margin-top:0">${esc(v.title)}</h3>
  <div class="sub">${esc(v.channel)} · ${meta(v)}</div><div class="snip">${esc(v.summary)}</div></a></div>`;
const commentText = (t) => esc(t).replace(/\[VIDEO\]/g, '<span class="mark v">▶ this video</span>').replace(/\[LINK\]/g, '<span class="mark">link</span>');
const hue = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
const signInPrompt = (what) => `<div class="empty">Sign in with GitHub to ${what}.<br><br><a class="pill primary" href="/api/auth/login">Sign in with GitHub</a></div>`;
const noApi = `<div class="empty">Community features need the MathTube server. Run <code>npm run dev</code> instead of a plain static server.</div>`;

function grid(videos) {
  if (!videos.length) return `<div class="empty">Nothing here yet.</div>`;
  const id = "g" + Math.random().toString(36).slice(2);
  setTimeout(() => {
    const el = document.getElementById(id), btn = document.getElementById(id + "m"); let n = 0;
    const more = () => { el.insertAdjacentHTML("beforeend", videos.slice(n, n += 48).map(card).join("")); btn.hidden = n >= videos.length; };
    btn.onclick = more; more();
  });
  return `<div class="grid" id="${id}"></div><button class="pill more" id="${id}m" hidden>Show more</button>`;
}

// upvote buttons anywhere on the page
view.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-vote]");

});

// seeded shuffle so "Shuffle" is stable while browsing, rerolls on reload
const seed = Math.floor(Math.random() * 1e9);
function shuffled(arr) {
  let s = seed; const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { s = (s * 1103515245 + 12345) % 2147483648; const j = s % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const allVideos = () => DATA.videos.concat(COMM.filter((v) => BY[v.vid] === v));

// ---------- pages ----------
function home(cat, sort) {
  const cats = DATA.categories;
  let vids = allVideos().filter((v) => !cat || v.cats.includes(cat));
  if (sort === "shuffle") vids = shuffled(vids);
  else if (sort === "intro") vids = vids.filter((v) => v.level === "intro" || v.level === "general");
  else if (sort === "deep") vids = vids.filter((v) => v.level === "intermediate" || v.level === "advanced");
  const q = (c, s) => `#/${c ? "c/" + c : ""}${s ? "?sort=" + s : ""}`;
  const sorts = [["", "Most recommended"], ["shuffle", "Shuffle"], ["intro", "Beginner-friendly"], ["deep", "Going deeper"]];
  const newcomer = !cat && !lists.history.length && !store.get("hideStart", false);
  view.innerHTML = `${cat ? `<div class="pagehead"><div><h2>${esc(cats[cat])}</h2></div></div>` : ""}
    ${newcomer ? `<div class="banner"><p><b>New to math, or coming back to it?</b> Follow a short learning path, one video at a time.</p>
      <a class="pill primary" href="#/start">Start here</a><button class="pill" id="hideStart">Not now</button></div>` : ""}
    <div class="chips">${[["", "All"], ...Object.entries(cats)].map(([id, name]) =>
      `<a class="chip ${id === (cat || "") ? "on" : ""}" href="${q(id, sort)}">${esc(name)}</a>`).join("")}</div>
    <div class="chips">${sorts.map(([s, name]) => `<a class="chip ${s === (sort || "") ? "on" : ""}" href="${q(cat, s)}">${name}</a>`).join("")}</div>
    ${grid(vids)}`;
  if (newcomer) $("#hideStart").onclick = () => { store.set("hideStart", true); $(".banner").remove(); };
}

// ---------- library: websites, YouTube playlists, GitHub repos ----------
async function library(tab, params) {
  view.innerHTML = `<div class="empty">Loading…</div>`;
  try {
    LIB ??= await Promise.all([fetch("data/library.json").then((r) => r.json()), fetch("data/repos.json").then((r) => r.json())]);
  } catch { view.innerHTML = `<div class="empty">Could not load the library. Please refresh.</div>`; return; }
  const [lib, gh] = LIB;
  tab = ["sites", "playlists", "repos"].includes(tab) ? tab : "sites";
  const level = params.get("level") || "", cat = params.get("cat") || "";
  const link = (k, v) => { const p = new URLSearchParams(params); v ? p.set(k, v) : p.delete(k); return `#/library/${tab}${p.toString() ? "?" + p : ""}`; };
  const chip = (k, v, label) => `<a class="chip ${(params.get(k) || "") === v ? "on" : ""}" href="${link(k, v)}">${esc(label)}</a>`;
  const levels = `<div class="chips">${chip("level", "", "All levels")}${lib.levels.map((l) => chip("level", l, l[0].toUpperCase() + l.slice(1))).join("")}</div>`;
  const tabs = `<div class="chips">${[["sites", `Websites (${lib.sites.length})`], ["playlists", `YouTube playlists (${lib.playlists.length})`], ["repos", `GitHub repos (${gh.repos.length})`]]
    .map(([t, n]) => `<a class="chip ${t === tab ? "on" : ""}" href="#/library/${t}">${n}</a>`).join("")}</div>`;
  const lvl = (x) => !level || x.levels.includes(level);
  const tags = (ls) => ls.map((l) => `<span class="tag">${esc(l)}</span>`).join("");
  let filters = "", items = "";
  if (tab === "sites") {
    filters = levels + `<div class="chips">${chip("cat", "", "All categories")}${Object.entries(lib.categories).map(([id, n]) => chip("cat", id, n)).join("")}</div>`;
    items = lib.sites.filter((s) => lvl(s) && (!cat || s.cat === cat)).map((s) => `<a class="lib" data-q="${esc((s.name + " " + s.desc).toLowerCase())}" href="${esc(s.url)}" target="_blank" rel="noopener">
      <h3>${esc(s.name)} ↗</h3><p>${esc(s.desc)}</p><div class="meta"><span class="tag">${esc(lib.categories[s.cat])}</span>${tags(s.levels)}${s.paid ? '<span class="tag">partly paid</span>' : ""}</div></a>`).join("");
  } else if (tab === "playlists") {
    const cats = [...new Set(lib.playlists.map((p) => p.cat))];
    filters = levels + `<div class="chips">${chip("cat", "", "All subjects")}${cats.map((c) => chip("cat", c, c)).join("")}</div>`;
    items = lib.playlists.filter((p) => lvl(p) && (!cat || p.cat === cat)).map((p) => `<a class="lib" data-q="${esc((p.title + " " + p.channel + " " + p.cat).toLowerCase())}" href="https://www.youtube.com/playlist?list=${esc(p.list)}" target="_blank" rel="noopener">
      <h3>${esc(p.title)} ↗</h3><p>${esc(p.channel)}</p><div class="meta"><span class="tag">${esc(p.cat)}</span>${tags(p.levels)}</div></a>`).join("");
  } else {
    filters = `<div class="chips">${chip("cat", "", "All")}${gh.groups.map((g) => chip("cat", g, g)).join("")}</div>`;
    const list = gh.repos.filter((r) => !cat || r.groups.includes(cat));
    // shortcut: renders up to 300 cards and filters the rest by search; fine for ~2k repos
    items = list.map((r, i) => `<a class="lib" ${i >= 300 ? "hidden data-more" : ""} data-q="${esc((r.name + " " + r.desc + " " + (r.lang || "")).toLowerCase())}" href="${esc(r.url)}" target="_blank" rel="noopener">
      <h3>${esc(r.name)} ↗</h3><p>${esc(r.desc)}</p><div class="meta"><span class="tag">★ ${r.stars.toLocaleString()}</span>${r.lang ? `<span class="tag">${esc(r.lang)}</span>` : ""}${r.archived ? '<span class="tag">archived</span>' : ""}${tags(r.groups)}</div></a>`).join("");
  }
  view.innerHTML = `<div class="pagehead"><div><h2>Library</h2><p>The best places to learn math outside MathTube, from first steps to research level.${tab === "repos" ? ` Most-starred math repositories on GitHub, updated ${esc(gh.generated)}.` : ""}</p></div></div>
    ${tabs}${filters}<div class="libbar"><input id="libq" type="search" placeholder="Filter this list…" aria-label="Filter this list"><span class="sub" id="libcount"></span></div>
    <div class="libgrid" id="libgrid">${items || `<div class="empty">Nothing matches these filters.</div>`}</div>`;
  const cards = [...view.querySelectorAll(".lib")];
  const apply = () => {
    const words = $("#libq").value.toLowerCase().split(/\s+/).filter(Boolean);
    let shown = 0;
    for (const c of cards) {
      const hit = words.every((w) => c.dataset.q.includes(w));
      c.hidden = !hit || (!words.length && c.hasAttribute("data-more"));
      shown += !c.hidden;
    }
    $("#libcount").textContent = words.length || cards.length <= 300 ? `${shown} shown` : `${shown} of ${cards.length} shown; type to search all`;
  };
  $("#libq").oninput = apply; apply();
}

function community(sort) {
  if (!API) { view.innerHTML = noApi; return; }
  const vids = COMM.slice().sort(sort === "top" ? (a, b) => b.votes - a.votes || new Date(b.createdAt) - new Date(a.createdAt)
    : (a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  view.innerHTML = `<div class="pagehead"><div><h2>Community</h2><p>Math videos shared by MathTube users. Upvote the ones worth watching.</p></div>
      <a class="pill primary" href="#/submit">+ Share a video</a></div>
    <div class="chips"><a class="chip ${sort !== "top" ? "on" : ""}" href="#/new">Newest</a><a class="chip ${sort === "top" ? "on" : ""}" href="#/new?sort=top">Top</a></div>
    ${vids.length ? vids.map(crow).join("") : `<div class="empty">No community videos yet. <a href="#/submit">Be the first to share one.</a></div>`}`;

function submit() {
  if (!API) { view.innerHTML = noApi; return; }
  if (!ME) { view.innerHTML = signInPrompt("share a math video"); return; }
  view.innerHTML = `<div class="pagehead"><div><h2>Share a math video</h2><p>Paste a YouTube link. Good picks teach something real: a proof, an idea, an aha moment.</p></div></div>
    <form class="form" id="sub">
      <label><span>YouTube link</span><input type="url" name="url" required placeholder="https://www.youtube.com/watch?v=…"></label>
      <div><span style="font-weight:600;display:block;margin-bottom:6px">Topics</span>
        <div class="checks">${Object.entries(DATA.categories).map(([id, n]) => `<label><input type="checkbox" name="cats" value="${id}">${esc(n)}</label>`).join("")}</div></div>
      <label><span>Why should people watch it?</span><textarea name="note" required minlength="10" maxlength="1000" placeholder="One or two sentences: what it explains and who it's for."></textarea></label>
      <div><button class="pill primary" type="submit">Share video</button> <span class="err" id="suberr"></span></div>
    </form>`;
  $("#sub").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target), btn = e.target.querySelector("button");
    btn.disabled = true; $("#suberr").textContent = "";
    try {
      const v = await api("videos", { method: "POST", body: { url: f.get("url"), cats: f.getAll("cats"), note: f.get("note") } });
      addCommunity([v]); VOTED.add(v.vid);
      toast("Thanks! Your video is live.");
      location.hash = "#/watch/" + v.vid;
    } catch (err) {
      $("#suberr").innerHTML = esc(err.message) + (err.data?.vid ? ` <a href="#/watch/${err.data.vid}" style="color:var(--accent)">See it</a>` : "");
      btn.disabled = false;
    }
  };
}

let myPlaylists = null;
const loadMine = async (force) => (myPlaylists = !force && myPlaylists ? myPlaylists : await api("playlists?mine=1"));

async function playlistMenu(anchor, vid) {
  const old = anchor.parentElement.querySelector(".menu");
  if (old) { old.remove(); return; }
  if (!ME) { location.href = "/api/auth/login"; return; }
  const menu = document.createElement("div");
  menu.className = "menu"; menu.textContent = "Loading…";
  anchor.parentElement.append(menu);
  const render = () => {
    menu.innerHTML = `<div class="sub" style="padding:4px 10px 8px">Save to playlist</div>${myPlaylists.map((p) =>
      `<button data-pl="${p.id}" class="${p.vids.includes(vid) ? "on" : ""}"><span class="box">✓</span>${esc(p.title)}</button>`).join("")}
      <button data-new><span class="box">+</span>New playlist</button>`;
  };
  try { await loadMine(); render(); } catch (e) { menu.textContent = e.message; return; }
  menu.onclick = async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    try {
      if (b.dataset.new !== undefined) {
        const title = prompt("Playlist name"); if (!title?.trim()) return;
        const p = await api("playlists", { method: "POST", body: { title, vid } });
        myPlaylists.unshift(p); toast(`Saved to “${p.title}”`);
      } else {
        const p = myPlaylists.find((x) => x.id === b.dataset.pl), has = p.vids.includes(vid);
        const up = await api("playlists", { method: "PATCH", body: { id: p.id, [has ? "remove" : "add"]: vid } });
        Object.assign(p, up); toast(has ? `Removed from “${p.title}”` : `Saved to “${p.title}”`);
      }
      render();
    } catch (err) { toast(err.message); }
  };
}

function watch(vid, pathId) {
  const v = BY[vid];
  if (!v) { view.innerHTML = `<div class="empty">Video not found. <a href="#/">Go home</a></div>`; return; }
  lists.history = lists.history.filter((x) => x !== vid).concat(vid).slice(-200); store.set("history", lists.history);
  const related = (v.related || []).map((r) => BY[r]).filter(Boolean);
  const fill = allVideos().filter((x) => x.vid !== vid && !related.includes(x) && x.cats.some((c) => v.cats.includes(c)));
  const upNext = related.concat(fill).slice(0, 20);
  const path = PATHS.find((p) => p.id === pathId), pv = path ? pathVids(path) : [];
  const step = pv.findIndex((x) => x.vid === vid), after = pv[step + 1];
  const pathBox = step < 0 ? "" : `<div class="nextpath"><p class="sub">${esc(path.title)} · ${step + 1} of ${pv.length}</p>
    ${after ? next(after).replace(`href="#/watch/${after.vid}"`, `href="#/watch/${after.vid}?path=${path.id}"`)
      : `<p style="margin:0">🎉 You finished this path. <a href="#/start" style="color:var(--accent)">Pick another</a></p>`}</div>`;
  const btn = (name, label, icon) => `<button class="pill ${lists[name].includes(vid) ? "on" : ""}" data-toggle="${name}">${icon}${label}</button>`;
  view.innerHTML = `<div class="watch"><div>
    <div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${vid}?rel=0&autoplay=1" title="${esc(v.title)}"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
    <h1>${esc(v.title)}</h1>
    <div class="actions"><span class="chan">${esc(v.channel)}</span>
      ${v.community ? `<button class="pill vote-pill ${VOTED.has(vid) ? "on" : ""}" data-vote="${vid}"><span>▲</span><span>${v.votes}</span></button>` : ""}
      ${btn("liked", "Like", '<svg viewBox="0 0 24 24"><path d="M18.77 11h-4.23l1.52-4.94C16.38 5.03 15.54 4 14.38 4c-.58 0-1.14.24-1.52.65L7 11H3v10h14.43c1.06 0 1.98-.67 2.19-1.61l1.34-6c.27-1.24-.78-2.39-2.19-2.39z"/></svg>')}
      ${btn("later", "Later", '<svg viewBox="0 0 24 24"><path d="M14.97 16.95 10 13.87V7h2v5.76l4.03 2.49-1.06 1.7zM12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/></svg>')}
      ${API ? `<button class="pill" id="plbtn"><svg viewBox="0 0 24 24"><path d="M3 6h12v2H3zm0 4h12v2H3zm0 4h8v2H3zm14-4v4h-4v2h4v4h2v-4h4v-2h-4v-4z"/></svg>Save</button>` : ""}
      <a class="pill" href="https://www.youtube.com/watch?v=${vid}" target="_blank" rel="noopener">YouTube ↗</a></div>
    <div class="desc">
      <div class="meta">${meta(v)}${v.type ? ` · ${esc(v.type)} · ${esc(v.level)}` : ""}</div>
      ${v.community ? `<p><b>Why watch it:</b> ${esc(v.summary)}</p>` : `<p>${esc(v.summary)}</p><p><b>Why HN recommends it:</b> ${esc(v.why)}</p>`}
      <div class="tags">${v.cats.map((c) => `<a href="#/c/${c}">#${esc(DATA.categories[c])}</a>`).join("")}
        ${(v.tags || []).map((t) => `<a href="#/search/${encodeURIComponent(t)}">${esc(t)}</a>`).join("")}</div>
    </div>
    ${v.comments ? `<section class="comments"><h2>What Hacker News said</h2>
      ${v.comments.map((c) => `<div class="cm"><div class="av" style="background:hsl(${hue(c.by)} 55% 45%)">${esc(c.by[0].toUpperCase())}</div>
        <div style="min-width:0"><div class="who"><b>${esc(c.by)}</b><a href="https://news.ycombinator.com/item?id=${c.id}" target="_blank" rel="noopener">${esc(c.month)} · on “${esc(c.story)}” ↗</a></div>
        <div class="text">${commentText(c.text)}</div></div></div>`).join("")}
    </section>` : ""}</div>
    <aside>${pathBox}${upNext.map(next).join("")}</aside></div>`;
  view.querySelectorAll("[data-toggle]").forEach((b) => b.onclick = () => b.classList.toggle("on", toggle(b.dataset.toggle, vid)));
  if ($("#plbtn")) $("#plbtn").onclick = (e) => playlistMenu(e.currentTarget, vid);
  scrollTo(0, 0);
}

    `<img loading="lazy" alt="" src="https://i.ytimg.com/vi/${v}/mqdefault.jpg">`).join("")}<span class="plcount">${p.vids.length} video${p.vids.length === 1 ? "" : "s"}</span></div>

async function playlists(mine) {
  if (!API) { view.innerHTML = noApi; return; }
  if (mine && !ME) { view.innerHTML = signInPrompt("make playlists"); return; }
  view.innerHTML = `<div class="pagehead"><div><h2>Playlists</h2><p>Learning paths made by the community, in the order they're meant to be watched.</p></div>
      ${ME ? `<button class="pill primary" id="newpl">+ New playlist</button>` : ""}</div>
    <div class="chips"><a class="chip ${mine ? "" : "on"}" href="#/playlists">All</a><a class="chip ${mine ? "on" : ""}" href="#/playlists?mine=1">Mine</a></div>
    <div id="pls" class="empty">Loading…</div>`;
  if ($("#newpl")) $("#newpl").onclick = async () => {
    const title = prompt("Playlist name"); if (!title?.trim()) return;
    try { const p = await api("playlists", { method: "POST", body: { title } }); myPlaylists?.unshift(p); location.hash = "#/p/" + p.id; }
    catch (e) { toast(e.message); }
  };
  try {
    const list = mine ? await loadMine(true) : await api("playlists");
    const el = $("#pls"); if (!el) return;
    el.className = list.length ? "plgrid" : "empty";
    el.innerHTML = list.length ? list.map(plCard).join("")
      : mine ? "You have no playlists yet. Open any video and press Save to start one." : "No playlists yet. Make the first one!";
  } catch (e) { $("#pls").textContent = e.message; }
}

async function playlist(id) {
  if (!API) { view.innerHTML = noApi; return; }
  view.innerHTML = `<div class="empty">Loading…</div>`;
  let p;
  try { p = await api("playlists?id=" + encodeURIComponent(id)); } catch (e) { view.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  const own = ME && ME.id === p.owner;
  const vids = p.vids.map((v) => BY[v] || { vid: v, title: "YouTube video", channel: "", summary: "", cats: [], recs: 0, years: ["", ""] });
  const playAll = vids.length ? `<a class="pill primary" target="_blank" rel="noopener" href="https://www.youtube.com/watch_videos?video_ids=${p.vids.slice(0, 50).join(",")}">▶ Play all on YouTube</a>` : "";
  view.innerHTML = `<div class="pagehead"><div><div class="sub"><a href="#/playlists">Playlists</a> · by ${esc(p.by)}</div>
      <h2>${esc(p.title)}</h2>${p.description ? `<p>${esc(p.description)}</p>` : ""}<div class="sub">${vids.length} video${vids.length === 1 ? "" : "s"}</div></div>
      ${playAll}${own ? `<button class="pill" id="pledit">Edit</button><button class="pill danger" id="pldel">Delete</button>` : ""}</div>
    ${vids.length ? vids.map((v, i) => `<div class="plrow"><span class="num">${i + 1}</span>${row(v)}${own ? `<button class="icon" data-rm="${v.vid}" title="Remove from playlist" aria-label="Remove">✕</button>` : "<span></span>"}</div>`).join("")
      : `<div class="empty">This playlist is empty. Open a video and press Save to add it here.</div>`}`;
  if (!own) return;
  $("#pldel").onclick = async () => {
    if (!confirm(`Delete “${p.title}”? This can't be undone.`)) return;
    try { await api("playlists?id=" + p.id, { method: "DELETE" }); myPlaylists = null; location.hash = "#/playlists?mine=1"; } catch (e) { toast(e.message); }
  };
  $("#pledit").onclick = async () => {
    const title = prompt("Playlist name", p.title); if (title === null) return;
    const description = prompt("Description (optional)", p.description || ""); if (description === null) return;
    try { await api("playlists", { method: "PATCH", body: { id: p.id, title, description } }); myPlaylists = null; playlist(id); } catch (e) { toast(e.message); }
  };
  view.querySelectorAll("[data-rm]").forEach((b) => b.onclick = async () => {
    try { await api("playlists", { method: "PATCH", body: { id: p.id, remove: b.dataset.rm } }); myPlaylists = null; playlist(id); } catch (e) { toast(e.message); }
  });
}

function search(q) {
  $("#q").value = q;
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const scored = allVideos().map((v) => {
    const title = v.title.toLowerCase(), m = [v.channel, v.topic, v.by, ...(v.tags || [])].join(" ").toLowerCase(), body = (v.summary + " " + (v.why || "")).toLowerCase();
    let s = 0;
    for (const w of words) { const t = title.includes(w) * 5 + m.includes(w) * 3 + body.includes(w); if (!t) return [0, v]; s += t; }
    return [s + (v.score || v.votes || 0) / 100, v];
  }).filter(([s]) => s > 0).sort((a, b) => b[0] - a[0]).map(([, v]) => v);
  view.innerHTML = `<div class="pagehead"><div><h2>Results for “${esc(q)}”</h2><p>${scored.length} video${scored.length === 1 ? "" : "s"}</p></div></div>
    ${scored.length ? scored.slice(0, 100).map(row).join("") : `<div class="empty">No math videos match that. Try “calculus”, “primes” or “3Blue1Brown”.</div>`}`;
}

function saved(name, title, blurb) {
  const vids = lists[name].slice().reverse().map((x) => BY[x]).filter(Boolean);
  view.innerHTML = `<div class="pagehead"><div><h2>${title}</h2><p>${blurb} Stored only in this browser.</p></div></div>${grid(vids)}`;
}

// ---------- router ----------
function route() {
  const [path, query] = location.hash.slice(1).split("?");
  const params = new URLSearchParams(query);
  const [, page, rawArg] = (path || "/").split("/");
  const arg = decodeURIComponent(rawArg || "");
  document.querySelectorAll(".side a").forEach((a) => a.classList.toggle("on",
    a.getAttribute("href") === "#/" + (page === "c" ? "c/" + arg : page || "")));
  $("#side").classList.remove("open");
  if (params.get("login") === "failed") toast("GitHub sign-in failed. Please try again.");
  if (page !== "watch") scrollTo(0, 0);
  if (!API && ["new", "submit", "playlists", "p"].includes(page)) { location.replace("#/"); return; }
  if (page === "watch") watch(arg, params.get("path"));
  else if (page === "c") home(arg, params.get("sort"));
  else if (page === "search") search(arg);
  else if (page === "start") start();
  else if (page === "path") pathPage(arg);
  else if (page === "library") library(arg, params);
  else if (page === "new") community(params.get("sort"));
  else if (page === "submit") submit();
  else if (page === "playlists") playlists(params.get("mine"));
  else if (page === "p") playlist(arg);
  else if (page === "liked") saved("liked", "Liked videos", "Videos you liked.");
  else if (page === "later") saved("later", "Watch later", "Videos you saved.");
  else if (page === "history") saved("history", "History", "Videos you opened.");
  else if (page === "about") about();
  else if (page === "extension") extension();
  else home("", params.get("sort"));
  const v = page === "watch" && BY[arg];
  document.title = v ? `${v.title} - MathTube` : SITE_TITLE;
}

function addCommunity(list) {
  for (const raw of list) {
    const v = { ...raw, community: true, level: "community" };
    if (BY[v.vid] && !BY[v.vid].community) continue;   // already in the curated set
    const i = COMM.findIndex((x) => x.vid === v.vid);
    i >= 0 ? (COMM[i] = v) : COMM.push(v);
    BY[v.vid] = v;
  }
}

  document.querySelectorAll("[data-api]").forEach((a) => a.hidden = !API);

}

$("#search").onsubmit = (e) => { e.preventDefault(); const q = $("#q").value.trim(); location.hash = q ? "#/search/" + encodeURIComponent(q) : "#/"; };
addEventListener("keydown", (e) => {
  if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); }
  if (e.key === "Escape") { document.activeElement.blur(); document.querySelector(".menu")?.remove(); }
});
addEventListener("hashchange", route);

(async () => {
  try {
    DATA = await fetch("data/videos.json").then((r) => r.json());
  } catch { view.innerHTML = `<div class="empty">Could not load videos. Please refresh.</div>`; return; }
  for (const v of DATA.videos) BY[v.vid] = v;
  $("#topics").innerHTML = Object.entries(DATA.categories).map(([id, name]) => `<a href="#/c/${id}">${esc(name)}</a>`).join("");
  PATHS = await fetch("data/paths.json").then((r) => r.json()).catch(() => []);
  document.querySelectorAll(".donate-link").forEach((a) => { a.href = DONATE_URL; a.hidden = !DONATE_URL; });
  // the community layer is optional: if it's off, or the API is missing or down, the curated site still works
  if (COMMUNITY) {
    const [me, comm] = await Promise.allSettled([api("me"), api("videos")]);
    if (me.status === "fulfilled") { API = true; ME = me.value.user; VOTED = new Set(me.value.voted); }
    if (comm.status === "fulfilled") addCommunity(comm.value);
  }
  renderAuth();
  route();
})();
</script>
